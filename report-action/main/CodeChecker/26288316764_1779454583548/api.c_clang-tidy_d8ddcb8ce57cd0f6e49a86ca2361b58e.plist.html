      .severity-low {
  background-color: #669603;
}

.severity-low:after {
  content : 'L';
}

.severity-unspecified {
  background-color: #666666;
}

.severity-unspecified:after {
  content : 'U';
}

.severity-style {
  background-color: #9932cc;
}

.severity-style:after {
  content : 'S';
}

.severity-medium {
  background-color: #a9d323;
  color: black;
}

.severity-medium:after {
  content : 'M';
}

.severity-high {
  background-color: #ffa800;
}

.severity-high:after {
  content : 'H';
}

.severity-critical {
  background-color: #e92625;
}

.severity-critical:after {
  content : 'C';
}

i[class*="severity-"] {
  line-height: normal;
  text-transform: capitalize;
  font-size: 0.8em;
  font-weight: bold;
  color: white;
  display: inline-block;
  width: 16px;
  height: 16px;
  text-align: center;
  font-family: sans-serif;
}

      html, body {
  width: 100%;
  height: 100%;
  padding: 0px;
  margin: 0px;
}

div.container {
  padding: 10px;
}

#content {
  height: 100%;
  display: block;
  overflow: hidden;
}

#content > div {
  margin: 10px;
  border: 1px solid #ddd;
  border-radius: 3px;
  height: 97%;
}

#side-bar {
  overflow: auto;
}

#editor-wrapper {
  overflow: hidden;
}

.button {
  background-color: #f1f1f1;
  text-decoration: none;
  display: inline-block;
  padding: 8px 16px;
  color: black;
  cursor: pointer;
}

.button:hover {
  background-color: #ddd;
  color: black;
}

.review-status {
  color: white;
  text-align: center;
}

.review-status-confirmed {
  background-color: #e92625;
}

.review-status-false-positive {
  background-color: grey;
}

.review-status-intentional {
  background-color: #669603;
}

      div.container {
  width: 100%;
  height: 100%;
  padding: 0px;
}

#editor-wrapper {
  margin: 10px;
}

#side-bar {
  float: left;
  width: 260px;
  margin: 0px;
}

#report-nav ul {
  list-style-type: none;
  padding: 0;
  margin: 0;
  overflow-y: auto;
  height: 100%;
}

#report-nav ul > li {
  padding: .4em;
  background-color: #fff;
  border-bottom: 1px solid rgba(0,0,0,.125);
  text-align: left;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

#report-nav ul > li.active {
  background-color: #427ea9;
  color: white;
}

#report-nav ul > li:hover {
  background-color: #427ea9;
  color: white;
  cursor: pointer;
}

#report-nav ul a {
  text-decoration: none;
}

#report-nav i[class*="severity-"] {
  margin-right: 5px;
}

.header {
  border-bottom: 1px solid lightgrey;
  font-family: monospace;
  padding: 10px;
  background-color: #fafbfc;
  border-bottom: 1px solid #e1e4e8;
  border-top-left-radius: 2px;
  border-top-right-radius: 2px;
}

#report-nav .header {
  font-weight: bold;
}

#editor-wrapper .header > div {
  padding-top: 2px;
}

#file-path,
#checker-name {
  color: #195ea2;
}

#review-status {
  padding: 0px 5px;
}

#file-path {
  font-family: monospace;
}

.check-msg {
  display: inline-block;
  padding: 3px 6px;
  margin: 1px;
  -webkit-border-radius: 5px;
  -moz-border-radius: 5px;
  border-radius: 5px;
}

.check-msg.info {
  color: #00546f;
  background-color: #bfdfe9;
  border: 1px solid #87a8b3;
}

.check-msg.error {
  background-color: #f2dede;
  color: #a94442;
  border: 1px solid #ebcccc;
}

.check-msg.macro {
  background-color: #d7dac2;
  color: #4f5c6d;
  border: 1px solid #d7dac2;
}

.check-msg.note {
  background-color: #d7d7d7;
  color: #4f5c6d;
  border: 1px solid #bfbfbf;
}

.check-msg.current {
  border: 2px dashed #3692ff;
}

.check-msg .tag {
  padding: 1px 5px;
  text-align: center;
  border-radius: 2px;
  margin-right: 5px;
  text-decoration: inherit;
}

.check-msg .tag.macro {
  background-color: #83876a;
  color: white;
  text-transform: capitalize;
}

.check-msg .tag.note {
  background-color: #9299a1;
  color: white;
  text-transform: capitalize;
}

.checker-enum {
  color: white;
  padding: 1px 5px;
  text-align: center;
  border-radius: 25px;
  margin-right: 5px;
  text-decoration: inherit;
}

.checker-enum.info {
  background-color: #427ea9;
}

.checker-enum.error {
  background-color: #a94442;
}

.arrow {
  border: solid black;
  border-width: 0 3px 3px 0;
  display: inline-block;
  padding: 3px;
  cursor: pointer;
  margin: 0px 5px;
}

.arrow:hover {
  border: solid #437ea8;
  border-width: 0 3px 3px 0;
}

.left-arrow {
  transform: rotate(135deg);
  -webkit-transform: rotate(135deg);
}

.right-arrow {
  transform: rotate(-45deg);
  -webkit-transform: rotate(-45deg);
}

var BugViewer = {
  _files : [],
  _reports : [],
  _lineWidgets : [],
  _navigationMenuItems : [],
  _sourceFileData : null,
  _currentReport : null,
  _lastBugEvent  : null,

  init : function (files, reports) {
    this._files = files;
    this._reports = reports;

    this.initEscapeChars();
  },

  initEscapeChars : function () {
    this.escapeChars = {
      ' ' : 'nbsp',
      '<' : 'lt',
      '>' : 'gt',
      '"' : 'quot',
      '&' : 'amp'
    };

    var regexString = '[';
    for (var key in this.escapeChars) {
      regexString += key;
    }
    regexString += ']';

    this.escapeRegExp = new RegExp( regexString, 'g');
  },

  escapeHTML : function (str) {
    var that = this;

    return str.replace(this.escapeRegExp, function (m) {
      return '&' + that.escapeChars[m] + ';';
    });
  },

  initByUrl : function () {
    if (!this._reports) return;

    var state = {};
    window.location.hash.substr(1).split('&').forEach(function (s) {
      var parts = s.split('=');
      state[parts[0]] = parts[1];
    });

    for (var key in this._reports) {
      var report = this._reports[key];
      if (report.reportHash === state['reportHash']) {
        this.navigate(report);
        return;
      }
    }

    this.navigate(this._reports[0]);
  },

  create : function () {
    this._content = document.getElementById('editor-wrapper');
    this._filepath = document.getElementById('file-path');
    this._checkerName = document.getElementById('checker-name');
    this._reviewStatusWrapper =
      document.getElementById('review-status-wrapper');
    this._reviewStatus = document.getElementById('review-status');
    this._editor = document.getElementById('editor');

    this._codeMirror = CodeMirror(this._editor, {
      mode: 'text/x-c++src',
      matchBrackets : true,
      lineNumbers : true,
      readOnly : true,
      foldGutter : true,
      extraKeys : {},

    });

    this._createNavigationMenu();
  },

  navigate : function (report, item) {
    if (!item) {

        return navItem.report.reportHash === report.reportHash;
      });

      if (!items.length) return;

      item = items[0].widget;

    this._selectedReport.classList.remove('active');
    this._selectedReport = item;
    this._selectedReport.classList.add('active');

  },

  _createNavigationMenu : function () {
    var that = this;

    var nav = document.getElementById('report-nav');
    var list = document.createElement('ul');
    this._reports.forEach(function (report) {
      var events = report.events;
      var lastBugEvent = events[events.length - 1];
      var item = document.createElement('li');

      var severity = document.createElement('i');
      severity.className = 'severity-' + report.severity.toLowerCase();

      item.appendChild(severity);
      item.appendChild(document.createTextNode(report.message));

      item.addEventListener('click', function () {
        that.navigate(report, item);
      })
      list.appendChild(item);

    if (!this._selectedReport && list.childNodes.length) {

  },

  setReport : function (report) {

    this.setReviewStatus(report.reviewStatus);

    window.location.hash = '#reportHash=' + report.reportHash;
  },

  setCurrentBugEvent : function (event, idx) {
    this._currentBugEvent = event;

    this.drawBugPath();

  },

  highlightBugEvent : function (idx) {
    this._lineWidgets.forEach(function (widget) {

      if (parseInt(lineIdx) === idx) {

  },

  setChecker : function (checker) {
    var content = checker.name;
    if (checker.url) {
      content = '<a href="' + checker.url + '" target="_blank">' +
        checker.name + '</a>';
    }

    this._checkerName.innerHTML = content;
  },

  setReviewStatus : function (status) {
    if (status) {
      var className =
        'review-status-' + status.toLowerCase().split(' ').join('-');

      this._reviewStatus.innerHTML = status;
      this._reviewStatusWrapper.style.display = 'block';
    } else {
      this._reviewStatusWrapper.style.display = 'none';
    }
  },

  setSourceFileData : function (file) {
    if (this._sourceFileData && file.id === this._sourceFileData.id) {

    this._sourceFileData = file;

  },

  _refresh : function () {

      var fullHeight = parseInt(that._content.clientHeight);
      var headerHeight = that._filepath.clientHeight;

  clearBubbles : function () {
    this._lineWidgets.forEach(function (widget) { widget.clear(); });

  },

  getMessage : function (event, kind) {
    if (kind === 'macro') {
      var name = 'macro expansion' + (event.name ? ': ' + event.name : '');

      return '<span class="tag macro">' + name + '</span>'
        + this.escapeHTML(event.message).replace(/(?:\r\n|\r|\n)/g, '<br>');
    } else if (kind === 'note') {
      return '<span class="tag note">note</span>'
        +  this.escapeHTML(event.message).replace(/(?:\r\n|\r|\n)/g, '<br>');
    }
  },

  addExtraPathEvents : function (events, kind) {
    var that = this;

    if (!events) {

    }

    events.forEach(function (event) {

      var element = document.createElement('div');
      element.setAttribute('style', 'margin-left: ' + left);
      element.setAttribute('class', 'check-msg ' + kind);

      var msg = document.createElement('span');

      element.appendChild(msg);

      that._lineWidgets.push(that._codeMirror.addLineWidget(

  },

  renderMainWarning : function (currentEvents) {
    if (this._currentReport.fileId != this._filepath.innerHTML)
      return false;

    if (currentEvents.length == 0) {
      return true;
    }

    var lastEvent = currentEvents[currentEvents.length - 1];

  drawBugPath : function () {
    var that = this;

    this.clearBubbles();

    var currentEvents = this._currentReport.events;

      var element = document.createElement('div');
      element.setAttribute('style', 'margin-left: ' + left);
      element.setAttribute('class', 'check-msg ' + type);
      element.setAttribute('idx', step);

      var enumeration = document.createElement('span');
      enumeration.setAttribute('class', 'checker-enum ' + type);

      if (currentEvents.length > 1)

      var prevBugEvent = step - 1;

        prevBug.addEventListener('click', function () {
          var event = currentEvents[prevBugEvent];

        element.appendChild(prevBug);

      var msg = document.createElement('span');

      element.appendChild(msg);

      var nextBugEvent = step + 1;
      if (nextBugEvent < currentEvents.length) {

          var event = currentEvents[nextBugEvent];
          that.setCurrentBugEvent(event, nextBugEvent);
        });
        element.appendChild(nextBug);

      that._lineWidgets.push(that._codeMirror.addLineWidget(
        event.line - 1, element));

    // the main warning message we print the warning message as a separate
    // error node.

      var element = document.createElement('div');

      element.setAttribute('style', 'margin-left: ' + left);
      element.setAttribute('class', 'check-msg ' + "error");
      var error_tag = document.createElement('span');
      error_tag.setAttribute('class', 'checker-enum error');
      error_tag.innerHTML = "E";
      element.appendChild(error_tag);
      var msg = document.createElement('span');
      msg.innerHTML = that.escapeHTML(this._currentReport.message)
        .replace(/(?:\r\n|\r|\n)/g, '<br>');
      element.appendChild(msg);
      that._lineWidgets.push(that._codeMirror.addLineWidget(
        this._currentReport.line - 1, element));
    }
  },

  jumpTo : function (line, column) {
    var that = this;

    setTimeout(function () {
      var selPosPixel

               : selPosPixel.left - 50,
        right  : selPosPixel.left < editorSize.width - 100
               ? 10
               : selPosPixel.left + editorSize.width - 100
      });
    }, 0);
  }
}

1, mac_byte2, mac_byte3);\n\n\treturn buffer;\n}\n\nchar *get_mac_address_string(char *buffer, int size)\n{\n\tstruct net_if *iface;\n\tstruct net_linkaddr *link_addr;\n\n\t// Get the default network interface\n\tiface = net_if_get_default();\n\tif (!iface) {\n\t\tLOG_ERR(&quot;No network interface found\\n&quot;);\n\t\treturn NULL;\n\t}\n\n\t// Get the link layer address (MAC address)\n\tlink_addr = net_if_get_link_addr(iface);\n\tif (!link_addr) {\n\t\tLOG_ERR(&quot;No MAC address available\\n&quot;);\n\t\treturn NULL;\n\t}\n\n\tmemset(buffer, 0, size);\n\tfor (int i = 0; i &lt; link_addr-&gt;len; i++) {\n\t\tchar tmp[4];\n\n\t\tif (i == 0) {\n\t\t\tsprintf(tmp, &quot;%02x&quot;, link_addr-&gt;addr[i]);\n\t\t} else {\n\t\t\tsprintf(tmp, &quot;:%02x&quot;, link_addr-&gt;addr[i]);\n\t\t}\n\t\tstrcat(buffer, tmp);\n\t}\n\n\treturn buffer;\n}\n\nint HelloRequestCb(const struct device *dev, HelloRequest *request)\n{\n\tconst struct esphome_config *config = esphome_get_config();\n\tconst struct esphome_api_config *api_config = dev-&gt;config;\n\tchar buffer[MAX_DEVICE_NAME];\n\n\tARG_UNUSED(request);\n\n\t/* TODO: negotiate API version  */\n\tHelloResponse response = HELLO_RESPONSE__INIT;\n\tresponse.name = get_unique_device_name(config-&gt;name, buffer, MAX_DEVICE_NAME);\n\tresponse.server_info = (char *)api_config-&gt;server_info;\n\tresponse.api_version_major = api_config-&gt;api_version_major;\n\tresponse.api_version_minor = api_config-&gt;api_version_minor;\n\n\treturn HelloResponseWrite(dev, &amp;response);\n}\n\nint ConnectRequestCb(const struct device *dev, ConnectRequest *request)\n{\n\tconst struct esphome_api_config *api_config = dev-&gt;config;\n\tConnectResponse response = CONNECT_RESPONSE__INIT;\n\n\tif (api_config-&gt;password) {\n\t\tresponse.invalid_password = strcmp(api_config-&gt;password, request-&gt;password);\n\t}\n\treturn ConnectResponseWrite(dev, &amp;response);\n}\n\nint DeviceInfoRequestCb(const struct device *dev)\n{\n\tchar version[32];\n\tconst struct esphome_config *config = esphome_get_config();\n\tconst struct esphome_api_config *api_config = dev-&gt;config;\n\tchar name[MAX_DEVICE_NAME];\n\tchar mac[MAC_ADDRESS_LEN];\n\tDeviceInfoResponse response = DEVICE_INFO_RESPONSE__INIT;\n\n\tif (api_config-&gt;password &amp;&amp; strlen(api_config-&gt;password)) {\n\t\tresponse.uses_password = true;\n\t}\n\tresponse.name = get_unique_device_name(config-&gt;name, name, MAX_DEVICE_NAME);\n\t_esphome_get_version(api_config, version, ARRAY_SIZE(version));\n\tresponse.esphome_version = version;\n\tresponse.compilation_time = (char *)config-&gt;compilation_time;\n\tresponse.project_name = (char *)config-&gt;project_name;\n\tresponse.project_version = (char *)config-&gt;project_version;\n\tresponse.model = (char *)config-&gt;model;\n\tresponse.manufacturer = (char *)config-&gt;manufacturer;\n\tresponse.mac_address = get_mac_address_string(mac, MAC_ADDRESS_LEN);\n\n\treturn DeviceInfoResponseWrite(dev, &amp;response);\n}\n\nint ListEntitiesRequestCb(const struct device *dev)\n{\n\tSTRUCT_SECTION_FOREACH(esphome_entity, entity) {\n\t\tentity-&gt;list_entity(dev, entity);\n\t}\n\n\treturn ListEntitiesDoneResponseWrite(dev);\n}\n\n#ifdef CONFIG_ESPHOME_COMPONENT_SWITCH\nint SwitchCommandRequestCb(const struct device *dev, SwitchCommandRequest *request)\n{\n\tconst struct device *switch_dev;\n\tSwitchStateResponse response = SWITCH_STATE_RESPONSE__INIT;\n\n\tswitch_dev = find_device_entity_by_key(request-&gt;key);\n\tif (!switch_dev) {\n\t\treturn -ENODEV;\n\t}\n\n\tpandora_switch_set_state(switch_dev, request-&gt;state);\n\tpandora_switch_get_state(switch_dev, &amp;response.state);\n\tresponse.key = request-&gt;key;\n\n\treturn SwitchStateResponseWrite(dev, &amp;response);\n}\n#endif\n\n#ifdef CONFIG_ESPHOME_COMPONENT_BUTTON\nint ButtonCommandRequestCb(const struct device *dev, ButtonCommandRequest *request)\n{\n\tconst struct device *button_dev;\n\n\tbutton_dev = find_device_entity_by_key(request-&gt;key);\n\tif (!button_dev) {\n\t\treturn -ENODEV;\n\t}\n\n\treturn esphome_button_on_press(button_dev);\n}\n#endif\n\nint LightCommandRequestCb(const struct device *dev, LightCommandRequest *request)\n{\n\tARG_UNUSED(dev);\n\tARG_UNUSED(request);\n\n\treturn -ENOTSUP;\n}\n\nint SubscribeStatesRequestCb(const struct device *dev)\n{\n\tSTRUCT_SECTION_FOREACH(esphome_entity, entity) {\n\t\tif (entity-&gt;publish_state) {\n\t\t\tentity-&gt;publish_state(dev, entity);\n\t\t}\n\t}\n\n\treturn 0;\n}\n\nint SubscribeHomeassistantServicesRequestCb(const struct device *dev)\n{\n\tARG_UNUSED(dev);\n\n\treturn 0;\n}\n\nint SubscribeHomeAssistantStatesRequestCb(const struct device *dev)\n{\n\tARG_UNUSED(dev);\n\n\treturn 0;\n}\n\nint PingRequestCb(const struct device *dev)\n{\n\treturn PingResponseWrite(dev);\n}\n\nint DisconnectRequestCb(const struct device *dev)\n{\n\tDisconnectResponseWrite(dev);\n\n\t/* Error will force connection to close */\n\treturn -ENOTCONN;\n}\n"}, "/home/runner/work/pandora/pandora/zephyr/include/zephyr/arch/common/ffs.h": {"id": "/home/runner/work/pandora/pandora/zephyr/include/zephyr/arch/common/ffs.h", "filePath": "/home/runner/work/pandora/pandora/zephyr/include/zephyr/arch/common/ffs.h", "content": "/*\n * Copyright (c) 2015, Wind River Systems, Inc.\n * Copyright (c) 2017, Oticon A/S\n *\n * SPDX-License-Identifier: Apache-2.0\n */\n\n#ifndef ZEPHYR_INCLUDE_ARCH_COMMON_FFS_H_\n#define ZEPHYR_INCLUDE_ARCH_COMMON_FFS_H_\n\n#ifndef _ASMLANGUAGE\n\n#include &lt;zephyr/types.h&gt;\n#include &lt;zephyr/toolchain.h&gt;\n\n#ifdef __cplusplus\nextern &quot;C&quot; {\n#endif\n\n/**\n *\n * @brief find most significant bit set in a 32-bit word\n *\n * This routine finds the first bit set starting from the most significant bit\n * in the argument passed in and returns the index of that bit.  Bits are\n * numbered starting at 1 from the least significant bit.  A return value of\n * zero indicates that the value passed is zero.\n *\n * @return most significant bit set, 0 if @a op is 0\n */\n\nstatic ALWAYS_INLINE unsigned int find_msb_set(uint32_t op)\n{\n\tif (op == 0) {\n\t\treturn 0;\n\t}\n\n\treturn 32 - __builtin_clz(op);\n}\n\n\n/**\n *\n * @brief find least significant bit set in a 32-bit word\n *\n * This routine finds the first bit set starting from the least significant bit\n * in the argument passed in and returns the index of that bit.  Bits are\n * numbered starting at 1 from the least significant bit.  A return value of\n * zero indicates that the value passed is zero.\n *\n * @return least significant bit set, 0 if @a op is 0\n */\n\nstatic ALWAYS_INLINE unsigned int find_lsb_set(uint32_t op)\n{\n#ifdef CONFIG_TOOLCHAIN_HAS_BUILTIN_FFS\n\treturn __builtin_ffs(op);\n\n#else\n\t/*\n\t * Toolchain does not have __builtin_ffs(). Leverage find_lsb_set()\n\t * by first clearing all but the lowest set bit.\n\t */\n\n\top = op ^ (op &amp; (op - 1));\n\n\treturn find_msb_set(op);\n#endif /* CONFIG_TOOLCHAIN_HAS_BUILTIN_FFS */\n}\n\n#ifdef __cplusplus\n}\n#endif\n\n#endif /* _ASMLANGUAGE */\n\n#endif /* ZEPHYR_INCLUDE_ARCH_COMMON_FFS_H_ */\n"}, "/home/runner/work/pandora/pandora/zephyr/include/zephyr/arch/common/sys_bitops.h": {"id": "/home/runner/work/pandora/pandora/zephyr/include/zephyr/arch/common/sys_bitops.h", "filePath": "/home/runner/work/pandora/pandora/zephyr/include/zephyr/arch/common/sys_bitops.h", "content": "/*\n * Copyright (c) 2020, Wind River Systems, Inc.\n * Copyright (c) 2017, Oticon A/S\n * Copyright (c) 2020, Synopsys\n *\n * SPDX-License-Identifier: Apache-2.0\n */\n\n/* Memory bits manipulation functions in non-arch-specific C code */\n\n#ifndef ZEPHYR_INCLUDE_ARCH_COMMON_SYS_BITOPS_H_\n#define ZEPHYR_INCLUDE_ARCH_COMMON_SYS_BITOPS_H_\n\n#ifndef _ASMLANGUAGE\n\n#include &lt;zephyr/toolchain.h&gt;\n#include &lt;zephyr/types.h&gt;\n#include &lt;zephyr/sys/sys_io.h&gt;\n\n#ifdef __cplusplus\nextern &quot;C&quot; {\n#endif\n\nstatic ALWAYS_INLINE void sys_set_bit(mem_addr_t addr, unsigned int bit)\n{\n\tuint32_t temp = *(volatile uint32_t *)addr;\n\n\t*(volatile uint32_t *)addr = temp | (1U &lt;&lt; bit);\n}\n\nstatic ALWAYS_INLINE void sys_clear_bit(mem_addr_t addr, unsigned int bit)\n{\n\tuint32_t temp = *(volatile uint32_t *)addr;\n\n\t*(volatile uint32_t *)addr = temp &amp; ~(1U &lt;&lt; bit);\n}\n\nstatic ALWAYS_INLINE int sys_test_bit(mem_addr_t addr, unsigned int bit)\n{\n\tuint32_t temp = *(volatile uint32_t *)addr;\n\n\treturn temp &amp; (1U &lt;&lt; bit);\n}\n\nstatic ALWAYS_INLINE void sys_set_bits(mem_addr_t addr, unsigned int mask)\n{\n\tuint32_t temp = *(volatile uint32_t *)addr;\n\n\t*(volatile uint32_t *)addr = temp | mask;\n}\n\nstatic ALWAYS_INLINE void sys_clear_bits(mem_addr_t addr, unsigned int mask)\n{\n\tuint32_t temp = *(volatile uint32_t *)addr;\n\n\t*(volatile uint32_t *)addr = temp &amp; ~mask;\n}\n\nstatic ALWAYS_INLINE\n\tvoid sys_bitfield_set_bit(mem_addr_t addr, unsigned int bit)\n{\n\t/* Doing memory offsets in terms of 32-bit values to prevent\n\t * alignment issues\n\t */\n\tsys_set_bit(addr + ((bit &gt;&gt; 5) &lt;&lt; 2), bit &amp; 0x1F);\n}\n\nstatic ALWAYS_INLINE\n\tvoid sys_bitfield_clear_bit(mem_addr_t addr, unsigned int bit)\n{\n\tsys_clear_bit(addr + ((bit &gt;&gt; 5) &lt;&lt; 2), bit &amp; 0x1F);\n}\n\nstatic ALWAYS_INLINE\n\tint sys_bitfield_test_bit(mem_addr_t addr, unsigned int bit)\n{\n\treturn sys_test_bit(addr + ((bit &gt;&gt; 5) &lt;&lt; 2), bit &amp; 0x1F);\n}\n\nstatic ALWAYS_INLINE\n\tint sys_test_and_set_bit(mem_addr_t addr, unsigned int bit)\n{\n\tint ret;\n\n\tret = sys_test_bit(addr, bit);\n\tsys_set_bit(addr, bit);\n\n\treturn ret;\n}\n\nstatic ALWAYS_INLINE\n\tint sys_test_and_clear_bit(mem_addr_t addr, unsigned int bit)\n{\n\tint ret;\n\n\tret = sys_test_bit(addr, bit);\n\tsys_clear_bit(addr, bit);\n\n\treturn ret;\n}\n\nstatic ALWAYS_INLINE\n\tint sys_bitfield_test_and_set_bit(mem_addr_t addr, unsigned int bit)\n{\n\tint ret;\n\n\tret = sys_bitfield_test_bit(addr, bit);\n\tsys_bitfield_set_bit(addr, bit);\n\n\treturn ret;\n}\n\nstatic ALWAYS_INLINE\n\tint sys_bitfield_test_and_clear_bit(mem_addr_t addr, unsigned int bit)\n{\n\tint ret;\n\n\tret = sys_bitfield_test_bit(addr, bit);\n\tsys_bitfield_clear_bit(addr, bit);\n\n\treturn ret;\n}\n\n#ifdef __cplusplus\n}\n#endif\n\n#endif /* _ASMLANGUAGE */\n\n#endif /* ZEPHYR_INCLUDE_ARCH_COMMON_SYS_BITOPS_H_ */\n"}, "/home/runner/work/pandora/pandora/zephyr/include/zephyr/drivers/sensor.h": {"id": "/home/runner/work/pandora/pandora/zephyr/include/zephyr/drivers/sensor.h", "filePath": "/home/runner/work/pandora/pandora/zephyr/include/zephyr/drivers/sensor.h", "content": "/*\n* Copyright (c) 2016 Intel Corporation\n*\n* SPDX-License-Identifier: Apache-2.0\n*/\n#ifndef ZEPHYR_INCLUDE_DRIVERS_SENSOR_H_\n#define ZEPHYR_INCLUDE_DRIVERS_SENSOR_H_\n\n/**\n * @file\n * @ingroup sensor_interface\n * @brief Main header file for sensor driver API.\n */\n\n/**\n * @brief Interfaces for sensors.\n * @defgroup sensor_interface Sensor\n * @since 1.2\n * @version 1.0.0\n * @ingroup io_interfaces\n * @{\n *\n * @defgroup sensor_interface_ext Device-specific Sensor API extensions\n * @{\n * @}\n */\n\n#include &lt;errno.h&gt;\n#include &lt;stdlib.h&gt;\n\n#include &lt;zephyr/device.h&gt;\n#include &lt;zephyr/drivers/sensor_data_types.h&gt;\n#include &lt;zephyr/dsp/types.h&gt;\n#include &lt;zephyr/rtio/rtio.h&gt;\n#include &lt;zephyr/sys/iterable_sections.h&gt;\n#include &lt;zephyr/types.h&gt;\n\n#ifdef __cplusplus\nextern &quot;C&quot; {\n#endif\n\n/**\n * @brief Representation of a sensor readout value.\n *\n * The value is represented as having an integer and a fractional part,\n * and can be obtained using the formula val1 + val2 * 10^(-6). Negative\n * values also adhere to the above formula, but may need special attention.\n * Here are some examples of the value representation:\n *\n *      0.5: val1 =  0, val2 =  500000\n *     -0.5: val1 =  0, val2 = -500000\n *     -1.0: val1 = -1, val2 =  0\n *     -1.5: val1 = -1, val2 = -500000\n */\nstruct sensor_value {\n\t/** Integer part of the value. */\n\tint32_t val1;\n\t/** Fractional part of the value (in one-millionth parts). */\n\tint32_t val2;\n};\n\n/**\n * @brief Sensor channels.\n */\nenum sensor_channel {\n\t/** Acceleration on the X axis, in m/s^2. */\n\tSENSOR_CHAN_ACCEL_X,\n\t/** Acceleration on the Y axis, in m/s^2. */\n\tSENSOR_CHAN_ACCEL_Y,\n\t/** Acceleration on the Z axis, in m/s^2. */\n\tSENSOR_CHAN_ACCEL_Z,\n\t/** Acceleration on the X, Y and Z axes. */\n\tSENSOR_CHAN_ACCEL_XYZ,\n\t/** Angular velocity around the X axis, in radians/s. */\n\tSENSOR_CHAN_GYRO_X,\n\t/** Angular velocity around the Y axis, in radians/s. */\n\tSENSOR_CHAN_GYRO_Y,\n\t/** Angular velocity around the Z axis, in radians/s. */\n\tSENSOR_CHAN_GYRO_Z,\n\t/** Angular velocity around the X, Y and Z axes. */\n\tSENSOR_CHAN_GYRO_XYZ,\n\t/** Magnetic field on the X axis, in Gauss. */\n\tSENSOR_CHAN_MAGN_X,\n\t/** Magnetic field on the Y axis, in Gauss. */\n\tSENSOR_CHAN_MAGN_Y,\n\t/** Magnetic field on the Z axis, in Gauss. */\n\tSENSOR_CHAN_MAGN_Z,\n\t/** Magnetic field on the X, Y and Z axes. */\n\tSENSOR_CHAN_MAGN_XYZ,\n\t/** Device die temperature in degrees Celsius. */\n\tSENSOR_CHAN_DIE_TEMP,\n\t/** Ambient temperature in degrees Celsius. */\n\tSENSOR_CHAN_AMBIENT_TEMP,\n\t/** Pressure in kilopascal. */\n\tSENSOR_CHAN_PRESS,\n\t/**\n\t * Proximity.  Adimensional.  A value of 1 indicates that an\n\t * object is close.\n\t */\n\tSENSOR_CHAN_PROX,\n\t/** Humidity, in percent. */\n\tSENSOR_CHAN_HUMIDITY,\n\t/** Ambient illuminance in visible spectrum, in lux. */\n\tSENSOR_CHAN_AMBIENT_LIGHT,\n\t/** Illuminance in visible spectrum, in lux. */\n\tSENSOR_CHAN_LIGHT,\n\t/** Illuminance in infra-red spectrum, in lux. */\n\tSENSOR_CHAN_IR,\n\t/** Illuminance in red spectrum, in lux. */\n\tSENSOR_CHAN_RED,\n\t/** Illuminance in green spectrum, in lux. */\n\tSENSOR_CHAN_GREEN,\n\t/** Illuminance in blue spectrum, in lux. */\n\tSENSOR_CHAN_BLUE,\n\t/** Altitude, in meters */\n\tSENSOR_CHAN_ALTITUDE,\n\n\t/** 1.0 micro-meters Particulate Matter, in ug/m^3 */\n\tSENSOR_CHAN_PM_1_0,\n\t/** 2.5 micro-meters Particulate Matter, in ug/m^3 */\n\tSENSOR_CHAN_PM_2_5,\n\t/** 10 micro-meters Particulate Matter, in ug/m^3 */\n\tSENSOR_CHAN_PM_10,\n\t/** Distance. From sensor to target, in meters */\n\tSENSOR_CHAN_DISTANCE,\n\n\t/** CO2 level, in parts per million (ppm) **/\n\tSENSOR_CHAN_CO2,\n\t/** O2 level, in parts per million (ppm) **/\n\tSENSOR_CHAN_O2,\n\t/** VOC level, in parts per billion (ppb) **/\n\tSENSOR_CHAN_VOC,\n\t/** Gas sensor resistance in ohms. */\n\tSENSOR_CHAN_GAS_RES,\n\t/** Flow rate in litres per minute */\n\tSENSOR_CHAN_FLOW_RATE,\n\n\t/** Voltage, in volts **/\n\tSENSOR_CHAN_VOLTAGE,\n\n\t/** Current Shunt Voltage in milli-volts **/\n\tSENSOR_CHAN_VSHUNT,\n\n\t/** Current, in amps **/\n\tSENSOR_CHAN_CURRENT,\n\t/** Power in watts **/\n\tSENSOR_CHAN_POWER,\n\n\t/** Resistance , in Ohm **/\n\tSENSOR_CHAN_RESISTANCE,\n\n\t/** Angular rotation, in degrees */\n\tSENSOR_CHAN_ROTATION,\n\n\t/** Position change on the X axis, in points. */\n\tSENSOR_CHAN_POS_DX,\n\t/** Position change on the Y axis, in points. */\n\tSENSOR_CHAN_POS_DY,\n\t/** Position change on the Z axis, in points. */\n\tSENSOR_CHAN_POS_DZ,\n\t/** Position change on the X, Y and Z axis, in points. */\n\tSENSOR_CHAN_POS_DXYZ,\n\n\t/** Revolutions per minute, in RPM. */\n\tSENSOR_CHAN_RPM,\n\n\t/** Frequency, in Hz. */\n\tSENSOR_CHAN_FREQUENCY,\n\n\t/** Voltage, in volts **/\n\tSENSOR_CHAN_GAUGE_VOLTAGE,\n\t/** Average current, in amps (negative=discharging) **/\n\tSENSOR_CHAN_GAUGE_AVG_CURRENT,\n\t/** Standby current, in amps (negative=discharging) **/\n\tSENSOR_CHAN_GAUGE_STDBY_CURRENT,\n\t/** Max load current, in amps (negative=discharging) **/\n\tSENSOR_CHAN_GAUGE_MAX_LOAD_CURRENT,\n\t/** Gauge temperature  **/\n\tSENSOR_CHAN_GAUGE_TEMP,\n\t/** State of charge measurement in % **/\n\tSENSOR_CHAN_GAUGE_STATE_OF_CHARGE,\n\t/** Full Charge Capacity in mAh **/\n\tSENSOR_CHAN_GAUGE_FULL_CHARGE_CAPACITY,\n\t/** Remaining Charge Capacity in mAh **/\n\tSENSOR_CHAN_GAUGE_REMAINING_CHARGE_CAPACITY,\n\t/** Nominal Available Capacity in mAh **/\n\tSENSOR_CHAN_GAUGE_NOM_AVAIL_CAPACITY,\n\t/** Full Available Capacity in mAh **/\n\tSENSOR_CHAN_GAUGE_FULL_AVAIL_CAPACITY,\n\t/** Average power in mW **/\n\tSENSOR_CHAN_GAUGE_AVG_POWER,\n\t/** State of health measurement in % **/\n\tSENSOR_CHAN_GAUGE_STATE_OF_HEALTH,\n\t/** Time to empty in minutes **/\n\tSENSOR_CHAN_GAUGE_TIME_TO_EMPTY,\n\t/** Time to full in minutes **/\n\tSENSOR_CHAN_GAUGE_TIME_TO_FULL,\n\t/** Cycle count (total number of charge/discharge cycles) **/\n\tSENSOR_CHAN_GAUGE_CYCLE_COUNT,\n\t/** Design voltage of cell in V (max voltage)*/\n\tSENSOR_CHAN_GAUGE_DESIGN_VOLTAGE,\n\t/** Desired voltage of cell in V (nominal voltage) */\n\tSENSOR_CHAN_GAUGE_DESIRED_VOLTAGE,\n\t/** Desired charging current in mA */\n\tSENSOR_CHAN_GAUGE_DESIRED_CHARGING_CURRENT,\n\t/** Game Rotation Vector (unit quaternion components X/Y/Z/W) */\n\tSENSOR_CHAN_GAME_ROTATION_VECTOR,\n\t/** Gravity Vector (X/Y/Z components in m/s^2) */\n\tSENSOR_CHAN_GRAVITY_VECTOR,\n\t/** Gyroscope bias (X/Y/Z components in radians/s) */\n\tSENSOR_CHAN_GBIAS_XYZ,\n\n\t/** All channels. */\n\tSENSOR_CHAN_ALL,\n\n\t/**\n\t * Number of all common sensor channels.\n\t */\n\tSENSOR_CHAN_COMMON_COUNT,\n\n\t/**\n\t * This and higher values are sensor specific.\n\t * Refer to the sensor header file.\n\t */\n\tSENSOR_CHAN_PRIV_START = SENSOR_CHAN_COMMON_COUNT,\n\n\t/**\n\t * Maximum value describing a sensor channel type.\n\t */\n\tSENSOR_CHAN_MAX = INT16_MAX,\n};\n\n/**\n * @brief Sensor trigger types.\n */\nenum sensor_trigger_type {\n\t/**\n\t * Timer-based trigger, useful when the sensor does not have an\n\t * interrupt line.\n\t */\n\tSENSOR_TRIG_TIMER,\n\t/** Trigger fires whenever new data is ready. */\n\tSENSOR_TRIG_DATA_READY,\n\t/**\n\t * Trigger fires when the selected channel varies significantly.\n\t * This includes any-motion detection when the channel is\n\t * acceleration or gyro. If detection is based on slope between\n\t * successive channel readings, the slope threshold is configured\n\t * via the @ref SENSOR_ATTR_SLOPE_TH and @ref SENSOR_ATTR_SLOPE_DUR\n\t * attributes.\n\t */\n\tSENSOR_TRIG_DELTA,\n\t/** Trigger fires when a near/far event is detected. */\n\tSENSOR_TRIG_NEAR_FAR,\n\t/**\n\t * Trigger fires when channel reading transitions configured\n\t * thresholds.  The thresholds are configured via the @ref\n\t * SENSOR_ATTR_LOWER_THRESH, @ref SENSOR_ATTR_UPPER_THRESH, and\n\t * @ref SENSOR_ATTR_HYSTERESIS attributes.\n\t */\n\tSENSOR_TRIG_THRESHOLD,\n\n\t/** Trigger fires when a single tap is detected. */\n\tSENSOR_TRIG_TAP,\n\n\t/** Trigger fires when a double tap is detected. */\n\tSENSOR_TRIG_DOUBLE_TAP,\n\n\t/** Trigger fires when a free fall is detected. */\n\tSENSOR_TRIG_FREEFALL,\n\n\t/** Trigger fires when motion is detected. */\n\tSENSOR_TRIG_MOTION,\n\n\t/** Trigger fires when no motion has been detected for a while. */\n\tSENSOR_TRIG_STATIONARY,\n\n\t/** Trigger fires when the FIFO watermark has been reached. */\n\tSENSOR_TRIG_FIFO_WATERMARK,\n\n\t/** Trigger fires when the FIFO becomes full. */\n\tSENSOR_TRIG_FIFO_FULL,\n\n\t/** Trigger fires when a tilt is detected. */\n\tSENSOR_TRIG_TILT,\n\n\t/** Trigger fires when data overflows. */\n\tSENSOR_TRIG_OVERFLOW,\n\n\t/**\n\t * Number of all common sensor triggers.\n\t */\n\tSENSOR_TRIG_COMMON_COUNT,\n\n\t/**\n\t * This and higher values are sensor specific.\n\t * Refer to the sensor header file.\n\t */\n\tSENSOR_TRIG_PRIV_START = SENSOR_TRIG_COMMON_COUNT,\n\n\t/**\n\t * Maximum value describing a sensor trigger type.\n\t */\n\tSENSOR_TRIG_MAX = INT16_MAX,\n};\n\n/**\n * @brief Sensor trigger spec.\n */\nstruct sensor_trigger {\n\t/** Trigger type. */\n\tenum sensor_trigger_type type;\n\t/** Channel the trigger is set on. */\n\tenum sensor_channel chan;\n};\n\n/**\n * @brief Sensor attribute types.\n */\nenum sensor_attribute {\n\t/**\n\t * Sensor sampling frequency, i.e. how many times a second the\n\t * sensor takes a measurement.\n\t */\n\tSENSOR_ATTR_SAMPLING_FREQUENCY,\n\t/** Lower threshold for trigger. */\n\tSENSOR_ATTR_LOWER_THRESH,\n\t/** Upper threshold for trigger. */\n\tSENSOR_ATTR_UPPER_THRESH,\n\t/** Threshold for any-motion (slope) trigger. */\n\tSENSOR_ATTR_SLOPE_TH,\n\t/**\n\t * Duration for which the slope values needs to be\n\t * outside the threshold for the trigger to fire.\n\t */\n\tSENSOR_ATTR_SLOPE_DUR,\n\t/* Hysteresis for trigger thresholds. */\n\tSENSOR_ATTR_HYSTERESIS,\n\t/** Oversampling factor */\n\tSENSOR_ATTR_OVERSAMPLING,\n\t/** Sensor range, in SI units. */\n\tSENSOR_ATTR_FULL_SCALE,\n\t/**\n\t * The sensor value returned will be altered by the amount indicated by\n\t * offset: final_value = sensor_value + offset.\n\t */\n\tSENSOR_ATTR_OFFSET,\n\t/**\n\t * Calibration target. This will be used by the internal chip&#x27;s\n\t * algorithms to calibrate itself on a certain axis, or all of them.\n\t */\n\tSENSOR_ATTR_CALIB_TARGET,\n\t/** Configure the operating modes of a sensor. */\n\tSENSOR_ATTR_CONFIGURATION,\n\t/** Set a calibration value needed by a sensor. */\n\tSENSOR_ATTR_CALIBRATION,\n\t/** Enable/disable sensor features */\n\tSENSOR_ATTR_FEATURE_MASK,\n\t/** Alert threshold or alert enable/disable */\n\tSENSOR_ATTR_ALERT,\n\t/** Free-fall duration represented in milliseconds.\n\t *  If the sampling frequency is changed during runtime,\n\t *  this attribute should be set to adjust freefall duration\n\t *  to the new sampling frequency.\n\t */\n\tSENSOR_ATTR_FF_DUR,\n\n\t/** Hardware batch duration in ticks */\n\tSENSOR_ATTR_BATCH_DURATION,\n\t/* Configure the gain of a sensor. */\n\tSENSOR_ATTR_GAIN,\n\t/* Configure the resolution of a sensor. */\n\tSENSOR_ATTR_RESOLUTION,\n\t/**\n\t * Number of all common sensor attributes.\n\t */\n\tSENSOR_ATTR_COMMON_COUNT,\n\n\t/**\n\t * This and higher values are sensor specific.\n\t * Refer to the sensor header file.\n\t */\n\tSENSOR_ATTR_PRIV_START = SENSOR_ATTR_COMMON_COUNT,\n\n\t/**\n\t * Maximum value describing a sensor attribute type.\n\t */\n\tSENSOR_ATTR_MAX = INT16_MAX,\n};\n\n/**\n * @typedef sensor_trigger_handler_t\n * @brief Callback API upon firing of a trigger\n *\n * @param dev Pointer to the sensor device\n * @param trigger The trigger\n */\ntypedef void (*sensor_trigger_handler_t)(const struct device *dev,\n\t\t\t\t\t const struct sensor_trigger *trigger);\n\n/**\n * @typedef sensor_attr_set_t\n * @brief Callback API upon setting a sensor&#x27;s attributes\n *\n * See sensor_attr_set() for argument description\n */\ntypedef int (*sensor_attr_set_t)(const struct device *dev,\n\t\t\t\t enum sensor_channel chan,\n\t\t\t\t enum sensor_attribute attr,\n\t\t\t\t const struct sensor_value *val);\n\n/**\n * @typedef sensor_attr_get_t\n * @brief Callback API upon getting a sensor&#x27;s attributes\n *\n * See sensor_attr_get() for argument description\n */\ntypedef int (*sensor_attr_get_t)(const struct device *dev,\n\t\t\t\t enum sensor_channel chan,\n\t\t\t\t enum sensor_attribute attr,\n\t\t\t\t struct sensor_value *val);\n\n/**\n * @typedef sensor_trigger_set_t\n * @brief Callback API for setting a sensor&#x27;s trigger and handler\n *\n * See sensor_trigger_set() for argument description\n */\ntypedef int (*sensor_trigger_set_t)(const struct device *dev,\n\t\t\t\t    const struct sensor_trigger *trig,\n\t\t\t\t    sensor_trigger_handler_t handler);\n/**\n * @typedef sensor_sample_fetch_t\n * @brief Callback API for fetching data from a sensor\n *\n * See sensor_sample_fetch() for argument description\n */\ntypedef int (*sensor_sample_fetch_t)(const struct device *dev,\n\t\t\t\t     enum sensor_channel chan);\n/**\n * @typedef sensor_channel_get_t\n * @brief Callback API for getting a reading from a sensor\n *\n * See sensor_channel_get() for argument description\n */\ntypedef int (*sensor_channel_get_t)(const struct device *dev,\n\t\t\t\t    enum sensor_channel chan,\n\t\t\t\t    struct sensor_value *val);\n\n/**\n * @brief Sensor Channel Specification\n *\n * A sensor channel specification is a unique identifier per sensor device describing\n * a measurement channel.\n *\n * @note Typically passed by value as the size of a sensor_chan_spec is a single word.\n */\nstruct sensor_chan_spec {\n\tuint16_t chan_type; /**&lt; A sensor channel type */\n\tuint16_t chan_idx;  /**&lt; A sensor channel index */\n};\n\n/** @cond INTERNAL_HIDDEN */\n/* Ensure sensor_chan_spec is sensibly sized to pass by value */\nBUILD_ASSERT(sizeof(struct sensor_chan_spec) &lt;= sizeof(uintptr_t),\n\t     &quot;sensor_chan_spec size should be equal or less than the size of a machine word&quot;);\n/** @endcond */\n\n/**\n * @brief Check if channel specs are equivalent\n *\n * @param chan_spec0 First chan spec\n * @param chan_spec1 Second chan spec\n * @retval true If equivalent\n * @retval false If not equivalent\n */\nstatic inline bool sensor_chan_spec_eq(struct sensor_chan_spec chan_spec0,\n\t\t\t\t       struct sensor_chan_spec chan_spec1)\n{\n\treturn chan_spec0.chan_type == chan_spec1.chan_type &amp;&amp;\n\t\tchan_spec0.chan_idx == chan_spec1.chan_idx;\n}\n\n/**\n * @brief Decodes a single raw data buffer\n *\n * Data buffers are provided on the @ref rtio context that&#x27;s supplied to\n * @ref sensor_read.\n */\nstruct sensor_decoder_api {\n\t/**\n\t * @brief Get the @p frame_count for a specified @p chan_spec from the @p buffer\n\t *\n\t * @param[in]  buffer      The buffer provided via the @ref rtio context\n\t * @param[in]  chan_spec   The channel specification to count\n\t * @param[out] frame_count The frame count for a specified @p chan_spec\n\t *\n\t * @retval 0       On success\n\t * @retval -EINVAL Invalid channel specification\n\t */\n\tint (*get_frame_count)(const uint8_t *buffer, struct sensor_chan_spec chan_spec,\n\t\t\t       uint16_t *frame_count);\n\n\t/**\n\t * @brief Get the size required to decode a given channel\n\t *\n\t * When decoding a single frame, use @p base_size. For every additional frame, add another\n\t * @p frame_size. As an example, to decode 3 frames use: &#x27;base_size + 2 * frame_size&#x27;.\n\t *\n\t * @param[in]  channel The channel to query\n\t * @param[out] base_size The size of decoding the first frame\n\t * @param[out] frame_size The additional size of every additional frame\n\t * @return 0 on success\n\t * @return -ENOTSUP if the channel is not supported\n\t */\n\tint (*get_size_info)(struct sensor_chan_spec channel, size_t *base_size,\n\t\t\t     size_t *frame_size);\n\n\t/**\n\t * @brief Decode up to @p max_count frames specified by @p chan_spec from the @p buffer\n\t *\n\t * Sample showing the process of decoding at most `MAX_FRAMES` for each distance\n\t * sensor channel. The frame iterator is reset for each new channel to allow the\n\t * full history of each channel to be decoded.\n\t *\n\t * @code{.c}\n\t * for (int i = 0; i &lt; NUM_DISTANCE_CHANNELS; i++) {\n\t *     fit = 0;\n\t *     decoder-&gt;decode(buffer, {SENSOR_CHAN_DISTANCE, i}, &amp;fit, MAX_FRAMES, out);\n\t * }\n\t * @endcode\n\t *\n\t * @param[in]     buffer      Buffer provided on the RTIO context\n\t * @param[in]     chan_spec   Channel specification to decode\n\t * @param[in,out] fit         Current frame iterator\n\t * @param[in]     max_count   Maximum number of frames to decode\n\t * @param[out]    data_out    Decoded data\n\t *\n\t * @return Number of frames that were decoded\n\t * @retval -EINVAL   Invalid parameters or unsupported channel\n\t * @retval -ENODATA  Requested data type not present in the frame\n\t */\n\tint (*decode)(const uint8_t *buffer, struct sensor_chan_spec chan_spec, uint32_t *fit,\n\t\t      uint16_t max_count, void *data_out);\n\n\t/**\n\t * @brief Check if the given trigger type is present\n\t *\n\t * @param[in] buffer The buffer provided on the @ref rtio context\n\t * @param[in] trigger The trigger type in question\n\t * @return Whether the trigger is present in the buffer\n\t */\n\tbool (*has_trigger)(const uint8_t *buffer, enum sensor_trigger_type trigger);\n};\n\n/**\n * @brief Used for iterating over the data frames via the sensor_decoder_api.\n *\n * Example usage:\n *\n * @code(.c)\n *     struct sensor_decode_context ctx = SENSOR_DECODE_CONTEXT_INIT(\n *         decoder, buffer, SENSOR_CHAN_ACCEL_XYZ, 0);\n *\n *     while (true) {\n *       struct sensor_three_axis_data accel_out_data;\n *\n *       num_decoded_channels = sensor_decode(ctx, &amp;accel_out_data, 1);\n *\n *       if (num_decoded_channels &lt;= 0) {\n *         printk(&quot;Done decoding buffer\\n&quot;);\n *         break;\n *       }\n *\n *       printk(&quot;Decoded (%&quot; PRId32 &quot;, %&quot; PRId32 &quot;, %&quot; PRId32 &quot;)\\n&quot;, accel_out_data.readings[0].x,\n *           accel_out_data.readings[0].y, accel_out_data.readings[0].z);\n *     }\n * @endcode\n */\nstruct sensor_decode_context {\n\tconst struct sensor_decoder_api *decoder;\n\tconst uint8_t *buffer;\n\tstruct sensor_chan_spec channel;\n\tuint32_t fit;\n};\n\n/**\n * @brief Initialize a sensor_decode_context\n */\n#define SENSOR_DECODE_CONTEXT_INIT(decoder_, buffer_, channel_type_, channel_index_)               \\\n\t{                                                                                          \\\n\t\t.decoder = (decoder_),                                                             \\\n\t\t.buffer = (buffer_),                                                               \\\n\t\t.channel = {.chan_type = (channel_type_), .chan_idx = (channel_index_)},           \\\n\t\t.fit = 0,                                                                          \\\n\t}\n\n/**\n * @brief Decode N frames using a sensor_decode_context\n *\n * @param[in,out] ctx The context to use for decoding\n * @param[out]    out The output buffer\n * @param[in]     max_count Maximum number of frames to decode\n * @return The decode result from sensor_decoder_ \n/** @brief Convert 16-bit value from host to network byte order.\n *\n * @param x The host byte order value to convert.\n *\n * @return Network byte order value.\n */\n#define net_htons(x) sys_cpu_to_be16(x)\n\n/** @brief Convert 32-bit value from host to network byte order.\n *\n * @param x The host byte order value to convert.\n *\n * @return Network byte order value.\n */\n#define net_htonl(x) sys_cpu_to_be32(x)\n\n/** @brief Convert 64-bit value from host to network byte order.\n *\n * @param x The host byte order value to convert.\n *\n * @return Network byte order value.\n */\n#define net_htonll(x) sys_cpu_to_be64(x)\n\n/** IPv6 address struct */\nstruct net_in6_addr {\n\tunion {\n\t\tuint8_t s6_addr[16];   /**&lt; IPv6 address buffer */\n\t\tuint16_t s6_addr16[8]; /**&lt; In big endian */\n\t\tuint32_t s6_addr32[4]; /**&lt; In big endian */\n\t};\n};\n\n/** Binary size of the IPv6 address */\n#define NET_IPV6_ADDR_SIZE 16\n\n/** IPv4 address struct */\nstruct net_in_addr {\n\tunion {\n\t\tuint8_t s4_addr[4];    /**&lt; IPv4 address buffer */\n\t\tuint16_t s4_addr16[2]; /**&lt; In big endian */\n\t\tuint32_t s4_addr32[1]; /**&lt; In big endian */\n\t\tuint32_t s_addr; /**&lt; In big endian, for POSIX compatibility. */\n\t};\n};\n\n/** Binary size of the IPv4 address */\n#define NET_IPV4_ADDR_SIZE 4\n\n/** Socket address family type */\ntypedef unsigned short int net_sa_family_t;\n\n/** Length of a socket address */\ntypedef uint32_t net_socklen_t;\n\n/*\n * Note that the sin_port and sin6_port are in network byte order\n * in various net_sockaddr* structs.\n */\n\n/** Socket address struct for IPv6. */\nstruct net_sockaddr_in6 {\n\tnet_sa_family_t\t\tsin6_family;   /**&lt; NET_AF_INET6           */\n\tuint16_t\t\tsin6_port;     /**&lt; Port number            */\n\tstruct net_in6_addr\tsin6_addr;     /**&lt; IPv6 address           */\n\tuint8_t\t\t\tsin6_scope_id; /**&lt; Interfaces for a scope */\n};\n\n/** Socket address struct for IPv4. */\nstruct net_sock                   */\n\tuint8_t         sll_halen;    /**&lt; Length of address                  */\n\tuint8_t        *sll_addr;     /**&lt; Physical-layer address, big endian */\n};\n\n/** Socket address struct for unix socket where address is a pointer */\nstruct net_sockaddr_un_ptr {\n\tnet_sa_family_t sun_family;   /**&lt; Always NET_AF_UNIX */\n\tchar           *sun_path;     /**&lt; Pathname           */\n};\n\nstruct net_sockaddr_can_ptr {\n\tnet_sa_family_t can_family;\n\tint             can_ifindex;\n};\n\n/** @endcond */\n\n#if !defined(HAVE_IOVEC)\n/** IO vector array element */\nstruct net_iovec {\n\tvoid  *iov_base; /**&lt; Pointer to data */\n\tsize_t iov_len;  /**&lt; Length of the data */\n};\n#endif\n\n/** Message struct */\nstruct net_msghdr {\n\tvoid             *msg_name;       /**&lt; Optional socket address, big endian */\n\tnet_socklen_t     msg_namelen;    /**&lt; Size of socket address */\n\tstruct net_iovec *msg_iov;        /**&lt; Scatter/gather array */\n\tsize_t            msg_iovlen;     /**&lt; Number of elements in msg_iov */\n\tvoid             *msg_control;    /**&lt; Ancillary data */\n\tsize_t            msg_controllen; /**&lt; Ancillary data buffer len */\n\tint               msg_flags;      /**&lt; Flags on received message */\n};\n\n/** Control message ancillary data */\nstruct net_cmsghdr {\n\tnet_socklen_t cmsg_len;    /**&lt; Number of bytes, including header */\n\tint           cmsg_level;  /**&lt; Originating protocol */\n\tint           cmsg_type;   /**&lt; Protocol-specific type */\n\tz_max_align_t cmsg_data[]; /**&lt; Flexible array member to force alignment of net_cmsghdr */\n};\n\n/** @cond INTERNAL_HIDDEN */\n\n/* Alignment for headers and data. These are arch specific but define\n * them here atm if not found already.\n */\n#if !defined(NET_ALIGN_H)\n#define NET_ALIGN_H(x) ROUND_UP(x, __alignof__(struct net_cmsghdr))\n#endif\n#if !defined(NET_ALIGN_D)\n#define NET_ALIGN_D(x) ROUND_UP(x, __alignof__(z_max_align_t))\n#endif\n\n/** @endcond */\n\n#if !defined(NET_CMSG_FIRSTHDR)\n/**\n * Returns a pointer to the first cmsghdr in the ancillary data buffer\n * associated with the passed msghdr.  It returns NULL if there isn&#x27;t\n * enough space for a cmsghdr in the buffer.\n */\n#define NET_CMSG_FIRSTHDR(msghdr)\t\t\t\t  \\\n\t((msghdr)-&gt;msg_controllen &gt;= sizeof(struct net_cmsghdr) ? \\\n\t (struct net_cmsghdr *)((msghdr)-&gt;msg_control) : NULL)\n#endif\n\n#if !defined(NET_CMSG_NXTHDR)\n/**\n * Returns the next valid cmsghdr after the passed cmsghdr. It returns NULL\n * when there isn&#x27;t enough space left in the buffer.\n */\n#define NET_CMSG_NXTHDR(msghdr, cmsg)\t\t\t\t\t \\\n\t(((cmsg) == NULL) ? NET_CMSG_FIRSTHDR(msghdr) :\t\t\t \\\n\t (((uint8_t *)(cmsg) + NET_ALIGN_H((cmsg)-&gt;cmsg_len) +\t\t \\\n\t   NET_ALIGN_D(sizeof(struct net_cmsghdr)) &gt;\t\t\t \\\n\t   (uint8_t *)((msghdr)-&gt;msg_control) + (msghdr)-&gt;msg_controllen) ? \\\n\t  NULL :\t\t\t\t\t\t\t \\\n\t  (struct net_cmsghdr *)((uint8_t *)(cmsg) +\t\t\t \\\n\t\t\t\t NET_ALIGN_H((cmsg)-&gt;cmsg_len))))\n#endif\n\n#if !defined(NET_CMSG_DATA)\n/**\n * Returns a pointer to the data portion of a cmsghdr.  The pointer returned\n * cannot be assumed to be suitably aligned for accessing arbitrary payload\n * data types. Applications should not cast it to a pointer type matching\n * the payload, but should instead use memcpy(3) to copy data to or from a\n * suitably declared object.\n */\n#define NET_CMSG_DATA(cmsg) ((uint8_t *)(cmsg) + NET_ALIGN_D(sizeof(struct net_cmsghdr)))\n#endif\n\n#if !defined(NET_CMSG_SPACE)\n/**\n * Returns the number of bytes an ancillary element with payload of the passed\n * data length occupies.\n */\n#define NET_CMSG_SPACE(length) (NET_ALIGN_D(sizeof(struct net_cmsghdr)) + NET_ALIGN_H(length))\n#endif\n\n#if !defined(NET_CMSG_LEN)\n/**\n * Returns the value to store in the cmsg_len member of the net_cmsghdr structure,\n * taking into account any necessary alignment.\n * It takes the data length as an argument.\n */\n#define NET_CMSG_LEN(length) (NET_ALIGN_D(sizeof(struct net_cmsghdr)) + length)\n#endif\n\n/** @cond INTERNAL_HIDDEN */\n\n/* Packet types.  */\n#define NET_PACKET_HOST         0     /* To us            */\n#define NET_PACKET_BROADCAST    1     /* To all           */\n#define NET_PACKET_MULTICAST    2     /* To group         */\n#define NET_PACKET_OTHERHOST    3     /* To someone else  */\n#define NET_PACKET_OUTGOING     4     /* Originated by us */\n#define NET_PACKET_LOOPBACK     5\n#define NET_PACKET_FASTROUTE    6\n\n/* ARP protocol HARDWARE identifiers. */\n#define NET_ARPHRD_ETHER 1\n#define NET_ARPHRD_PPP   512\n\n/* Note: These macros are defined in a specific order.\n * The largest sockaddr size is the last one.\n */\n#if defined(CONFIG_NET_IPV4)\n#undef NET_SOCKADDR_MAX_SIZE\n#undef NET_SOCKADDR_PTR_MAX_SIZE\n#define NET_SOCKADDR_MAX_SIZE (sizeof(struct net_sockaddr_in))\n#define NET_SOCKADDR_PTR_MAX_SIZE (sizeof(struct net_sockaddr_in_ptr))\n#endif\n\n#if defined(CONFIG_NET_SOCKETS_PACKET)\n#undef NET_SOCKADDR_MAX_SIZE\n#undef NET_SOCKADDR_PTR_MAX_SIZE\n#define NET_SOCKADDR_MAX_SIZE (sizeof(struct net_sockaddr_ll))\n#define NET_SOCKADDR_PTR_MAX_SIZE (sizeof(struct net_sockaddr_ll_ptr))\n#endif\n\n#if defined(CONFIG_NET_IPV6)\n#undef NET_SOCKADDR_MAX_SIZE\n#define NET_SOCKADDR_MAX_SIZE (sizeof(struct net_sockaddr_in6))\n#if !defined(CONFIG_NET_SOCKETS_PACKET)\n#undef NET_SOCKADDR_PTR_MAX_SIZE\n#define NET_SOCKADDR_PTR_MAX_SIZE (sizeof(struct net_sockaddr_in6_ptr))\n#endif\n#endif\n\n#if defined(CONFIG_NET_NATIVE_OFFLOADED_SOCKETS)\n#define UNIX_PATH_MAX 108\n#undef NET_SOCKADDR_MAX_SIZE\n/* Define NET_SOCKADDR_MAX_SIZE to be struct of sa_family_t + char[UNIX_PATH_MAX] */\n#define NET_SOCKADDR_MAX_SIZE (UNIX_PATH_MAX+sizeof(net_sa_family_t))\n#if !defined(CONFIG_NET_SOCKETS_PACKET)\n#undef NET_SOCKADDR_PTR_MAX_SIZE\n#define NET_SOCKADDR_PTR_MAX_SIZE (sizeof(struct net_sockaddr_un_ptr))\n#endif\n#endif\n\n#if !defined(CON t\t\t0, 0, 0, 0, 0, 0, 0, 1 } } }\n\n/** IPv4 any address */\n#define NET_INADDR_ANY 0\n\n/** IPv4 broadcast address */\n#define NET_INADDR_BROADCAST 0xffffffff\n\n/** IPv4 address initializer */\n#define NET_INADDR_ANY_INIT { { { NET_INADDR_ANY } } }\n\n/** IPv6 loopback address initializer */\n#define NET_INADDR_LOOPBACK_INIT  { { { 127, 0, 0, 1 } } }\n\n/** Max length of the IPv4 address as a string. Defined by POSIX. */\n#define NET_INET_ADDRSTRLEN 16\n\n/** Max length of the IPv6 address as a string. Takes into account possible\n * mapped IPv4 addresses.\n */\n#define NET_INET6_ADDRSTRLEN 46\n\n/** @cond INTERNAL_HIDDEN */\n\n/* These are for internal usage of the stack */\n#define NET_IPV6_ADDR_LEN sizeof(&quot;xxxx:xxxx:xxxx:xxxx:xxxx:xxxx:xxx.xxx.xxx.xxx&quot;)\n#define NET_IPV4_ADDR_LEN sizeof(&quot;xxx.xxx.xxx.xxx&quot;)\n\n/** @endcond */\n\n/** @brief IP Maximum Transfer Unit */\nenum net_ip_mtu {\n\t/** IPv6 MTU length. We must be able to receive this size IPv6 packet\n\t * without fragmentation.\n\t */\n#if defined(CONFIG_NET_NATIVE_IPV6)\n\tNET_IPV6_MTU = CONFIG_NET_IPV6_MTU,\n#else\n\tNET_IPV6_MTU = 1280,\n#endif\n\n\t/** IPv4 MTU length. We must be able to receive this size IPv4 packet\n\t * without fragmentation.\n\t */\n#if defined(CONFIG_NET_NATIVE_IPV4)\n\tNET_IPV4_MTU = CONFIG_NET_IPV4_MTU,\n#else\n\tNET_IPV4_MTU = 576,\n#endif\n};\n\n/** @brief Network packet priority settings described in IEEE 802.1Q Annex I.1 */\nenum net_priority {\n\tNET_PRIORITY_BK = 1, /**&lt; Background (lowest)                */\n\tNET_PRIORITY_BE = 0, /**&lt; Best effort (default)              */\n\tNET_PRIORITY_EE = 2, /**&lt; Excellent effort                   */\n\tNET_PRIORITY_CA = 3, /**&lt; Critical applications              */\n\tNET_PRIORITY_VI = 4, /**&lt; Video, &lt; 100 ms latency and jitter */\n\tNET_PRIORITY_VO = 5, /**&lt; Voice, &lt; 10 ms latency and jitter  */\n\tNET_PRIORITY_IC = 6, /**&lt; Internetwork control               */\n\tNET_PRIORITY_NC = 7  /**&lt; Network control (highest)          */\n} __packed;\n\n#define NET_MAX_PRIORITIES 8 /**&lt; How many priority values there are */\n\n/** @brief IPv6/IPv4 network connection tuple */\nstruct net_tuple {\n\tstruct net_addr *remote_addr;  /**&lt; IPv6/IPv4 remote address */\n\tstruct net_addr *local_addr;   /**&lt; IPv6/IPv4 local address  */\n\tuint16_t remote_port;          /**&lt; UDP/TCP remote port      */\n\tuint16_t local_port;           /**&lt; UDP/TCP local port       */\n\tenum net_ip_protocol ip_proto; /**&lt; IP protocol              */\n};\n\n/** @brief What is the current state of the network address */\nenum net_addr_state {\n\tNET_ADDR_ANY_STATE = -1, /**&lt; Default (invalid) address type */\n\tNET_ADDR_TENTATIVE = 0,  /**&lt; Tentative address              */\n\tNET_ADDR_PREFERRED,      /**&lt; Preferred address              */\n\tNET_ADDR_DEPRECATED,     /**&lt; Deprecated address             */\n} __packed;\n\n/** @brief How the network address is assigned to network interface */\nenum net_addr_type {\n\t/** Default value. This is not a valid value. */\n\tNET_ADDR_ANY = 0,\n\t/** Auto configured address */\n\tNET_ADDR_AUTOCONF,\n\t/** Address is from DHCP */\n\tNET_ADDR_DHCP,\n\t/** Manually set address */\n\tNET_ADDR_MANUAL,\n\t/** Manually set address which is overridable by DHCP */\n\tNET_ADDR_OVERRIDABLE,\n} __packed;\n\n/** @cond INTERNAL_HIDDEN */\n\nstruct net_ipv6_hdr {\n\tuint8_t vtc;\n\tuint8_t tcflow;\n\tuint16_t flow;\n\tuint16_t len;\n\tuint8_t nexthdr;\n\tuint8_t hop_limit;\n\tuint8_t src[NET_IPV6_ADDR_SIZE];\n\tuint8_t dst[NET_IPV6_ADDR_SIZE];\n} __packed;\n\nstruct net_ipv6_frag_hdr {\n\tuint8_t nexthdr;\n\tuint8_t reserved;\n\tuint16_t offset;\n\tuint32_t id;\n} __packed;\n\nstruct net_ipv4_hdr {\n\tuint8_t vhl;\n\tuint8_t tos;\n\tuint16_t len;\n\tuint8_t id[2];\n\tuint8_t offset[2];\n\tuint8_t ttl;\n\tuint8_t proto;\n\tuint16_t chksum;\n\tuint8_t src[NET_IPV4_ADDR_SIZE];\n\tuint8_t dst[NET_IPV4_ADDR_SIZE];\n} __packed;\n\nstruct net_icmp_hdr {\n\tuint8_t type;\n\tuint8_t code;\n\tuint16_t chksum;\n} __packed;\n\nstruct net_udp_hdr {\n\tuint16_t src_port;\n\tuint16_t dst_port;\n\tuint16_t len;\n\tuint16_t chksum;\n} __packed;\n\nstruct net_tcp_hdr {\n\tuint16_t src_port;\n\tuint16_t dst_port;\n\tuint8_t seq[4];\n\tuint8_t ack[4];\n\tuint8_t offset;\n\tuint8_t flags;\n\tuint8_t wnd[2];\n\tuint16_t chksum;\n\tuint8_t urg[2];\n\tuint8_t optdata[0];\n} __packed;\n\nstatic inline const char *net_addr_type2str(enum net_addr_type type)\n{\n\tswitch (type) {\n\tcase NET_ADDR_AUTOCONF:\n\t\treturn &quot;AUTO&quot;;\n\tcase NET_ADDR_DHCP:\n\t\treturn &quot;DHCP&quot;;\n\tcase NET_ADDR_MANUAL:\n\t\treturn &quot;MANUAL&quot;;\n\tcase NET_ADDR_OVERRIDABLE:\n\t\treturn &quot;OVERRIDE&quot;;\n\tcase NET_ADDR_ANY:\n\tdefault:\n\t\tbreak;\n\t}\n\n\treturn &quot;&lt;unknown&gt;&quot;;\n}\n\n/* IPv6 extension headers types */\n#define NET_IPV6_NEXTHDR_HBHO        0\n#define NET_IPV6_NEXTHDR_DESTO       60\n#define NET_IPV6_NEXTHDR_ROUTING     43\n#define NET_IPV6_NEXTHDR_FRAG        44\n#define NET_IPV6_NEXTHDR_NONE        59\n\n/**\n * This 2 unions are here temporarily, as long as net_context.h will\n * be still public and not part of the core only.\n */\nunion net_ip_header {\n\tstruct net_ipv4_hdr *ipv4;\n\tstruct net_ipv6_hdr *ipv6;\n};\n\nunion net_proto_header {\n\tstruct net_udp_hdr *udp;\n\tstruct net_tcp_hdr *tcp;\n};\n\n#define NET_UDPH_LEN\t8\t\t\t/* Size of UDP header */\n#define NET_TCPH_LEN\t20\t\t\t/* Size of TCP header */\n#define NET_ICMPH_LEN\t4\t\t\t/* Size of ICMP header */\n\n#define NET_IPV6H_LEN\t   40\t\t\t/* Size of IPv6 header */\n#define NET_ICMPV6H_LEN\t   NET_ICMPH_LEN\t/* Size of ICMPv6 header */\n#define NET_IPV6UDPH_LEN   (NET_UDPH_LEN + NET_IPV6H_LEN) /* IPv6 + UDP */\n#define NET_IPV6TCPH_LEN   (NET_TCPH_LEN + NET_IPV6H_LEN) /* IPv6 + TCP */\n#define NET_IPV6ICMPH_LEN  (NET_IPV6H_LEN + NET_ICMPH_LEN) /* ICMPv6 + IPv6 */\n#define NET_IPV6_FRAGH_LEN 8\n\n#define NET_IPV4 IP address of local interface */\n\tint                imr_ifindex;   /**&lt; Network interface index       */\n};\n\n/**\n * @brief Struct used when setting a IPv4 multicast network interface.\n */\nstruct net_ip_mreq  {\n\tstruct net_in_addr imr_multiaddr; /**&lt; IP multicast group address    */\n\tstruct net_in_addr imr_interface; /**&lt; IP address of local interface */\n};\n\n/**\n * @brief Struct used when joining or leaving a IPv6 multicast group.\n */\nstruct net_ipv6_mreq {\n\t/** IPv6 multicast address of group */\n\tstruct net_in6_addr ipv6mr_multiaddr;\n\n\t/** Network interface index of the local IPv6 address */\n\tint ipv6mr_ifindex;\n};\n\n/**\n * @brief Incoming IPv6 packet information.\n *\n * Used as ancillary data when calling recvmsg() and IPV6_RECVPKTINFO socket\n * option is set.\n */\nstruct net_in6_pktinfo {\n\tstruct net_in6_addr ipi6_addr;    /**&lt; Destination IPv6 address */\n\tunsigned int        ipi6_ifindex; /**&lt; Receive interface index */\n};\n\n/** @cond INTERNAL_HIDDEN */\nstatic inline bool net_ipv6_is_addr_loopback_raw(const uint8_t *addr)\n{\n\treturn UNALIGNED_GET((uint32_t *)addr) == 0 &amp;&amp;\n\t       UNALIGNED_GET((uint32_t *)addr + 1) == 0 &amp;&amp;\n\t       UNALIGNED_GET((uint32_t *)addr + 2) == 0 &amp;&amp;\n\t       net_ntohl(UNALIGNED_GET((uint32_t *)addr + 3)) == 1;\n}\n/** @endcond */\n\n/**\n * @brief Check if the IPv6 address is a loopback address (::1).\n *\n * @param addr IPv6 address\n *\n * @return True if address is a loopback address, False otherwise.\n */\nstatic inline bool net_ipv6_is_addr_loopback(const struct net_in6_addr *addr)\n{\n\treturn net_ipv6_is_addr_loopback_raw(addr-&gt;s6_addr);\n}\n\n/** @cond INTERNAL_HIDDEN */\nstatic inline bool net_ipv6_is_addr_mcast_raw(const uint8_t *addr)\n{\n\treturn addr[0] == 0xff;\n}\n/** @endcond */\n\n/**\n * @brief Check if the IPv6 address is a multicast address.\n *\n * @param addr IPv6 address\n *\n * @return True if address is multicast address, Fal
